name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Check formatting
        run: swift format lint --recursive --strict Package.swift Sources Tests
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
